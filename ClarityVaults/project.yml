# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
name: ClarityVaults
options:
  bundleIdPrefix: com.clarityvaults
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en-GB
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # set your Apple Developer Team ID here (needed for the widget's App Group on a device)
targets:
  ClarityVaults:
    type: application
    platform: iOS
    sources:
      - path: ClarityVaults
      - path: Shared
    dependencies:
      - target: ClarityWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clarityvaults.app
        PRODUCT_NAME: Clarity Vaults
        PRODUCT_MODULE_NAME: ClarityVaults
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Config/ClarityVaults.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Clarity Vaults
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_NSFaceIDUsageDescription: Clarity Vaults uses Face ID to keep your finances private.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  ClarityWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ClarityWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clarityvaults.app.widget
        PRODUCT_NAME: ClarityWidget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Config/ClarityWidget.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/ClarityWidget-Info.plist
        SKIP_INSTALL: YES
  ClarityVaultsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ClarityVaultsTests
    dependencies:
      - target: ClarityVaults
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Clarity Vaults.app/Clarity Vaults"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  ClarityVaults:
    build:
      targets:
        ClarityVaults: all
        ClarityVaultsTests: [test]
    test:
      targets:
        - ClarityVaultsTests
